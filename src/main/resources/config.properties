# ---------------------------------------------------------------------------
# Framework configuration
#
# Every key can be overridden, in this order of priority, by:
#   1. an environment variable named RB_<KEY>  (dots become underscores,
#      e.g. base.url -> RB_BASE_URL, username -> RB_USERNAME)
#   2. a JVM system property        (e.g. mvn test -Dbase.url=https://...)
#   3. src/main/resources/config.local.properties (optional, git-ignored)
#   4. the values in this file
# ---------------------------------------------------------------------------

base.url=https://restful-booker.herokuapp.com

# Timeouts in milliseconds
connection.timeout=15000
response.timeout=30000

# Maximum acceptable response time (ms) for positive-path assertions
response.time.threshold=8000

# Credentials are intentionally left blank so no secret ships in the project.
# Provide them through RB_USERNAME / RB_PASSWORD (recommended) or through
# config.local.properties. See README.md for the exact commands.
username=admin
password=password123
